# ============================================================
#  O'QUV DASTURI: Islomiy moliya — noldan professional darajagacha
#  Agent mavzularni tartib bilan oladi. Tugagach, o'zi yangi
#  ilg'or mavzular ishlab chiqadi (config: auto_extend).
#  Mavzu qo'shish/o'chirish/tartibini o'zgartirish mumkin.
# ============================================================

auto_extend: true

modules:
  - name_uz: "1-modul. Asoslar"
    name_en: "Module 1. Foundations"
    topics:
      - uz: "Islomiy moliya nima va u nima uchun kerak?"
        en: "What is Islamic finance and why does it matter?"
        focus: "Definition, core idea (finance tied to real economy, ethics), common myths ('it is just renamed interest'), who uses it today."
      - uz: "Maqosid ash-shariʼa: islomiy moliyaning maqsadlari"
        en: "Maqasid al-Shariah: the goals behind Islamic finance"
        focus: "Five objectives (din, nafs, aql, nasl, mal), protection of wealth, justice, why rules exist."
      - uz: "Shariat manbalari: Qurʼon, Sunnat, ijmoʼ va qiyos"
        en: "Sources of Shariah: Quran, Sunnah, ijma and qiyas"
        focus: "How rulings are derived, role of ijtihad, why modern products need scholars."
      - uz: "Islomda pul tushunchasi: pul — tovar emas"
        en: "Money in Islam: money is not a commodity"
        focus: "Money as medium of exchange and measure of value, why money cannot 'give birth' to money."
      - uz: "Riba nima? Foizning taqiqlanishi"
        en: "What is riba? The prohibition of interest"
        focus: "Definition, Quran 2:275-279 general reference, difference between trade and riba."
      - uz: "Riba turlari: riba an-nasiʼa va riba al-fazl"
        en: "Types of riba: riba al-nasi'ah and riba al-fadl"
        focus: "Six ribawi items hadith (gold, silver, wheat, barley, dates, salt), hand-to-hand and equal rules, everyday examples like currency exchange."
      - uz: "Gʻarar: noaniqlik qachon taqiqlanadi?"
        en: "Gharar: when is uncertainty prohibited?"
        focus: "Excessive vs minor gharar, examples (selling fish in the sea, unclear price), relevance to contracts and insurance."
      - uz: "Maysir: qimor va spekulyatsiya"
        en: "Maysir: gambling and speculation"
        focus: "Zero-sum gain, lotteries, difference between investment risk and gambling."
      - uz: "Harom sohalar: qayerga sarmoya kiritib bo'lmaydi?"
        en: "Prohibited industries: where you cannot invest"
        focus: "Alcohol, pork, gambling, conventional finance, adult entertainment, tobacco (scholarly views), weapons debate."
      - uz: "Risk va foydani bo'lishish tamoyili"
        en: "The principle of profit and loss sharing"
        focus: "Al-ghunm bil-ghurm, al-kharaj bid-daman, why the lender guaranteed return is the problem."
      - uz: "Real aktivga bogʻliqlik: har bir moliya ortida tovar bo'lishi kerak"
        en: "Asset-backing: every financing needs a real asset"
        focus: "Linking finance to real goods/services, why this reduces bubbles."
      - uz: "Halol daromad va kasb odobi"
        en: "Halal earnings and business ethics"
        focus: "Honesty, no fraud (ghish), fair weights, transparency, contracts fulfilment (Quran 5:1 general)."

  - name_uz: "2-modul. Islomiy shartnomalar (aqdlar)"
    name_en: "Module 2. Islamic contracts"
    topics:
      - uz: "Shartnoma (aqd) asoslari: rukn va shartlar"
        en: "Contract basics in Islamic law: pillars and conditions"
        focus: "Offer/acceptance, parties, subject matter, price; valid, voidable, void contracts."
      - uz: "Murobaha: tannarx ustiga foyda qo'shib sotish"
        en: "Murabaha: cost-plus sale"
        focus: "Steps, bank must own the asset, disclosed markup, difference from a loan, example of buying a car."
      - uz: "Murobahada keng uchraydigan xatolar"
        en: "Common mistakes in murabaha"
        focus: "Selling before owning, late payment penalties (charity), rollover not allowed, binding promise debate."
      - uz: "Musovama: narxni oshkor qilmasdan savdo"
        en: "Musawamah: negotiated sale"
        focus: "Difference from murabaha, when used."
      - uz: "Salam: oldindan to'lov bilan savdo"
        en: "Salam: forward sale with advance payment"
        focus: "Conditions (full payment upfront, specified goods, quantity, date), agriculture finance example."
      - uz: "Istisnoʼ: buyurtma asosida ishlab chiqarish"
        en: "Istisna: manufacturing and construction financing"
        focus: "Differences from salam, construction and housing projects, parallel istisna."
      - uz: "Ijara: islomiy lizing"
        en: "Ijara: Islamic leasing"
        focus: "Owner bears ownership risk, maintenance responsibilities, rent setting, example."
      - uz: "Ijara muntahiya bit-tamlik: mulkka aylanadigan ijara"
        en: "Ijarah muntahia bittamleek: lease ending in ownership"
        focus: "Separate transfer by gift or sale, used for home and car finance."
      - uz: "Muzoraba: sarmoya va mehnat sherikligi"
        en: "Mudarabah: capital and expertise partnership"
        focus: "Rab al-mal and mudarib, profit ratio not fixed amount, loss borne by capital provider unless negligence."
      - uz: "Mushoraka: to'liq sheriklik"
        en: "Musharakah: joint venture partnership"
        focus: "Capital contributions, profit by agreement, loss by capital ratio, business example."
      - uz: "Kamayuvchi mushoraka: uy-joy uchun sheriklik"
        en: "Diminishing musharakah: partnership for home financing"
        focus: "Gradual buyout of bank share plus rent on bank share, worked numeric example."
      - uz: "Vakola: vakillik shartnomasi"
        en: "Wakalah: agency contract"
        focus: "Fee-based agency, investment wakalah, takaful use."
      - uz: "Qarzi hasan: foizsiz qarz"
        en: "Qard hasan: the benevolent loan"
        focus: "Only principal repaid, gifts conditioned prohibited, social role."
      - uz: "Kafola, rahn va havola: kafillik, garov va qarzni o'tkazish"
        en: "Kafalah, rahn and hawalah: guarantee, pledge, debt transfer"
        focus: "Short explanation of each with modern use."
      - uz: "Juʼala va boshqa xizmat shartnomalari"
        en: "Ju'alah and other service contracts"
        focus: "Reward for completed task, examples."
      - uz: "Tavarruq: munozarali vosita"
        en: "Tawarruq: a debated instrument"
        focus: "Classic vs organized tawarruq, OIC Fiqh Academy resolution against organized tawarruq (2009), present views fairly."
      - uz: "Bayʼ al-ʼiyna: nega jumhur ulamolar man qilgan?"
        en: "Bay' al-inah: why most scholars prohibit it"
        focus: "Sale and buyback as legal trick (hila) for interest."

  - name_uz: "3-modul. Islomiy bank ishi"
    name_en: "Module 3. Islamic banking"
    topics:
      - uz: "Islomiy bank qanday ishlaydi?"
        en: "How does an Islamic bank work?"
        focus: "Two-tier mudarabah model, assets vs liabilities side, comparison with conventional bank."
      - uz: "Islomiy bankdagi depozitlar: joriy va investitsion hisob"
        en: "Deposits in an Islamic bank: current and investment accounts"
        focus: "Current account as qard/wadiah, investment account as mudarabah, no guaranteed return."
      - uz: "Islomiy bank foydani qanday taqsimlaydi?"
        en: "How Islamic banks distribute profit"
        focus: "Profit pools, weightages, PER and IRR reserves."
      - uz: "Islomiy uy-joy moliyalash: qaysi model qulay?"
        en: "Islamic home financing: which model works best?"
        focus: "Murabaha vs ijara vs diminishing musharakah, pros/cons for buyer."
      - uz: "Islomiy avtokredit: mashinani halol yo'l bilan olish"
        en: "Islamic car financing explained"
        focus: "Murabaha and ijara for cars, what to check in a contract."
      - uz: "Islomiy bank kartalari va to'lov tizimlari"
        en: "Islamic cards and payment systems"
        focus: "Debit cards, charge cards, Islamic credit card structures and controversies."
      - uz: "Islomiy oyna (Islamic window) nima?"
        en: "What is an Islamic window?"
        focus: "Conventional banks offering Islamic products, segregation of funds, concerns."
      - uz: "Islomiy va an'anaviy bank: 7 ta asosiy farq"
        en: "Islamic vs conventional banking: 7 key differences"
        focus: "Clear comparison, avoid exaggeration, admit where products look similar and why form and substance matter."
      - uz: "O'zbekistonda islomiy moliya: qonunchilik va amaliyot"
        en: "Islamic finance in Uzbekistan: law and practice"
        focus: "USE SEARCH for the latest status of laws, licensed providers and pilot programs; mention date of info; do not invent."
      - uz: "Kechiktirilgan to'lovlar: jarima nega xayriyaga ketadi?"
        en: "Late payments: why penalties go to charity"
        focus: "AAOIFI approach, ta'widh debate, difference from interest."

  - name_uz: "4-modul. Kapital bozorlari va investitsiya"
    name_en: "Module 4. Capital markets and investing"
    topics:
      - uz: "Sukuk nima? Islomiy obligatsiyalar"
        en: "What are sukuk? Islamic bonds explained"
        focus: "Ownership in assets vs debt, cash flows, difference from bonds."
      - uz: "Sukuk turlari: ijara, muzoraba, mushoraka, vakola"
        en: "Types of sukuk: ijarah, mudarabah, musharakah, wakalah"
        focus: "Short description of each, which are most common."
      - uz: "Aksiyalar halolmi? Shariat skriningi"
        en: "Are stocks halal? Shariah screening"
        focus: "Business activity screen and financial ratio screens (debt, interest income, liquid assets) per AAOIFI standard 21 thresholds; note index providers differ."
      - uz: "Dividendni tozalash (purification)"
        en: "Dividend purification explained"
        focus: "Why and how to calculate, worked example."
      - uz: "Islomiy investitsiya fondlari va ETFlar"
        en: "Islamic funds and ETFs"
        focus: "How they work, Shariah board, fees, what to check."
      - uz: "Islomiy REIT: ko'chmas mulkka halol sarmoya"
        en: "Islamic REITs: halal real estate investing"
        focus: "Rental income screening, tenant activity rules."
      - uz: "Kriptovalyuta va islomiy moliya: ulamolar nima deydi?"
        en: "Cryptocurrency and Islamic finance: scholarly views"
        focus: "Present main positions fairly, criteria (mal, gharar, use), avoid verdict, advise consulting scholars."
      - uz: "Valyuta ayirboshlash (sarf) qoidalari"
        en: "Currency exchange (sarf) rules"
        focus: "Spot settlement, forex trading with leverage issues, swaps."
      - uz: "Derivativlar va xejlash: islomiy yondashuv"
        en: "Derivatives and hedging: the Islamic approach"
        focus: "Why conventional options/futures problematic, wa'd-based hedging, IIFM standards."
      - uz: "Boshlovchi uchun halol investitsiya rejasi"
        en: "A halal investing plan for beginners"
        focus: "Emergency fund, goals, diversified halal options; general education only, not personal advice."

  - name_uz: "5-modul. Takaful (islomiy sugʻurta)"
    name_en: "Module 5. Takaful (Islamic insurance)"
    topics:
      - uz: "Takaful nima va oddiy sugʻurtadan farqi"
        en: "What is takaful and how it differs from insurance"
        focus: "Mutual help (taawun), tabarru donation, gharar/maysir/riba issues in conventional insurance."
      - uz: "Takaful modellari: vakola, muzoraba va gibrid"
        en: "Takaful models: wakalah, mudarabah and hybrid"
        focus: "Operator role, surplus distribution."
      - uz: "Oilaviy takaful va retakaful"
        en: "Family takaful and retakaful"
        focus: "Life-like protection and savings, reinsurance in Islamic form."

  - name_uz: "6-modul. Shaxsiy moliya va ijtimoiy moliya"
    name_en: "Module 6. Personal and social finance"
    topics:
      - uz: "Zakot asoslari: kimga, qachon va qancha?"
        en: "Zakat basics: who, when and how much?"
        focus: "Nisab, hawl, 2.5%, eight categories of recipients (Quran 9:60)."
      - uz: "Naqd pul va oltinga zakot hisoblash"
        en: "Calculating zakat on cash and gold"
        focus: "Nisab in gold (about 85 g) and silver (about 595 g), worked example in so'm, note to check current gold price."
      - uz: "Aksiyalar va biznesga zakot"
        en: "Zakat on shares and business assets"
        focus: "Trading vs long-term holding approaches, business inventory valuation."
      - uz: "Sadaqa va vaqf: xayriyaning moliyaviy kuchi"
        en: "Sadaqah and waqf: the financial power of charity"
        focus: "Waqf history, cash waqf, modern waqf funds."
      - uz: "Musulmon oilasi uchun byudjet tuzish"
        en: "Budgeting for a Muslim family"
        focus: "Practical method, avoiding israf, saving, sadaqah line."
      - uz: "Qarzdan qanday qutulish mumkin?"
        en: "How to get out of debt"
        focus: "Islamic view on debt, practical repayment strategies, avoiding interest debt."
      - uz: "Merosni taqsimlash (farooiz) asoslari"
        en: "Basics of Islamic inheritance (fara'id)"
        focus: "Main heirs and shares overview, wasiyyah up to 1/3, advise to consult specialist."
      - uz: "Islomiy mikromoliya: kichik biznesga yordam"
        en: "Islamic microfinance: supporting small business"
        focus: "Models (qard hasan, murabaha, mudarabah), social impact."

  - name_uz: "7-modul. Professional daraja"
    name_en: "Module 7. Professional level"
    topics:
      - uz: "Shariat kengashi: kim va qanday nazorat qiladi?"
        en: "Shariah boards: who supervises and how?"
        focus: "Composition, independence, fatwa process, conflicts of interest."
      - uz: "AAOIFI, IFSB va boshqa xalqaro tashkilotlar"
        en: "AAOIFI, IFSB and other standard setters"
        focus: "Role of each, key standards, which countries apply them."
      - uz: "Shariat auditi va muvofiqlik (compliance)"
        en: "Shariah audit and compliance"
        focus: "Internal/external audit, non-compliant income handling."
      - uz: "Islomiy moliya buxgalteriyasi asoslari"
        en: "Basics of Islamic finance accounting"
        focus: "Why IFRS alone may not reflect substance, AAOIFI FAS overview."
      - uz: "Islomiy banklarda risk boshqaruvi"
        en: "Risk management in Islamic banks"
        focus: "Credit, market, liquidity, rate of return, displaced commercial risk, Shariah non-compliance risk."
      - uz: "Islomiy fintex: yangi imkoniyatlar"
        en: "Islamic fintech: new opportunities"
        focus: "USE SEARCH for recent examples; crowdfunding, digital banks, robo-advisors."
      - uz: "Global islomiy moliya bozori: raqamlar va tendensiyalar"
        en: "The global Islamic finance market: numbers and trends"
        focus: "USE SEARCH for latest figures (asset size, leading countries) with source and year; never invent numbers."
      - uz: "Islomiy moliyada karyera: sertifikatlar va kasblar"
        en: "Careers in Islamic finance: certifications and roles"
        focus: "CSAA, CIPA (AAOIFI), CIFE and others; roles; how to start."
      - uz: "Islomiy moliyaga tanqidlar va ularga javoblar"
        en: "Criticisms of Islamic finance and responses"
        focus: "Form vs substance critique, debt-based dominance, honest balanced discussion."
      - uz: "Kurs yakuni: islomiy moliya bo'yicha 10 ta asosiy saboq"
        en: "Course wrap-up: 10 key lessons of Islamic finance"
        focus: "Recap of the whole curriculum, invite next steps."
